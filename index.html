    <!-- Splash screen (phones / installed app only, once per session).
         Plain HTML + CSS so it shows before the app's JavaScript loads;
         src/main.jsx fades it out once React has rendered. -->
    <style>
      #kt-splash { display: none; }
      @media (max-width: 1024px), (display-mode: standalone) {
        html:not(.kt-no-splash) #kt-splash {
          position: fixed; inset: 0; z-index: 2147483647;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
          background: #ffffff;
          padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
          transition: opacity 0.35s ease;
        }
      }
      #kt-splash.kt-splash-hide { opacity: 0; pointer-events: none; }
      #kt-splash img { width: min(62vw, 260px); height: auto; animation: kt-splash-in 0.6s ease-out both; }
      #kt-splash .kt-splash-bar { width: 120px; height: 3px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
      #kt-splash .kt-splash-bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: inherit; background: #2a6a12;
        animation: kt-splash-load 1.1s ease-in-out infinite;
      }
      #kt-splash p {
        position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); left: 0; right: 0; margin: 0;
        text-align: center; font: 500 12px/1.4 Inter, system-ui, sans-serif; color: #64748b; letter-spacing: 0.02em;
      }
      @keyframes kt-splash-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @keyframes kt-splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #kt-splash img, #kt-splash .kt-splash-bar::after { animation: none; }
      }
    </style>
    <script>
      try { if (sessionStorage.getItem('kt-splash-seen')) document.documentElement.classList.add('kt-no-splash'); } catch (e) {}
    </script>
  </head>
  <body style="overflow-x: hidden;">
    <div id="kt-splash" role="status" aria-label="Loading KalsaTrack">
      <img src="/splash-logo.png" alt="KalsaTrack" width="784" height="304" />
      <div class="kt-splash-bar" aria-hidden="true"></div>
      <p>Farm-to-Market Road Monitoring · DA Region VI</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
